# Testy przy każdym pull requeście i pushu na master. Po pushu (merge'u PR) na master, jeśli testy
# przeszły, automatyczne wdrożenie na VPS. Da się też odpalić ręcznie: Actions → Deploy → Run workflow.
#
# Klucz z sekretu VPS_SSH_KEY jest na serwerze zapisany w authorized_keys z command="…/deploy.sh",restrict,
# więc nawet po wycieku pozwala wyłącznie uruchomić wdrożenie (bez shella). Opis: deploy/README.md.
name: Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Testy backendu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      # Testy integracyjne stawiają Postgresa przez Testcontainers (Docker jest na runnerze).
      - run: dotnet test Turniejo-backend/Turniejo.slnx --nologo
      # Nie ma go w Turniejo.slnx — sprawdza, że każdy endpoint ma autoryzację.
      - run: dotnet test Turniejo-backend/tests/Turniejo.Architecture.UnitTests --nologo

  frontend:
    name: Testy frontendu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Turniejo-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Turniejo-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Globalne typy PageProps/LayoutProps generuje Next (lokalnie robi to `next dev`).
      - run: npx next typegen
        env:
          # next.config wymaga API_URL przy starcie; wartość nie ma znaczenia dla typów.
          API_URL: http://localhost:8080
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Testy E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Turniejo-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Turniejo-frontend/package-lock.json
      - run: npm ci
      # Testy działają na produkcyjnym buildzie Next z mockiem backendu (bez .NET i Keycloaka);
      # playwright.config uruchamia oba serwery sam. Przeglądarka to Chrome (channel: "chrome").
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: Turniejo-frontend/playwright-report
          retention-days: 7

  deploy:
    name: Wdrożenie
    needs: [backend, frontend, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Kolejne pushe czekają, aż poprzednie wdrożenie się skończy (nie przerywamy trwającego buildu).
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Wdrożenie przez SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # Serwer jeszcze nieskonfigurowany (brak sekretów) → pomijamy zamiast czerwonego błędu.
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::warning::Brak sekretów VPS_HOST / VPS_USER / VPS_SSH_KEY / VPS_KNOWN_HOSTS. Wdrożenie pominięte (deploy/README.md)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # -T: bez terminala (klucz ma "restrict"). Komendę wybiera serwer (command= w authorized_keys).
          ssh -T -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST"
