# ⚠️ DEV ONLY — NIE UŻYWAĆ NA PRODUKCJI.
# Wszystkie hasła poniżej (turniejo/turniejo, admin/admin) są celowo trywialne i jawnie wpisane —
# to lokalne środowisko developerskie, nie ma tu żadnych prawdziwych sekretów. Produkcja:
# deploy/docker-compose.prod.yml + deploy/.env (patrz deploy/README.md).
services:
  postgres:
    image: postgres:16
    container_name: turniejo-postgres
    environment:
      # Hasło dev — patrz ostrzeżenie na górze pliku.
      POSTGRES_USER: turniejo
      POSTGRES_PASSWORD: turniejo
      POSTGRES_DB: turniejo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turniejo"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: turniejo-keycloak
    environment:
      # Hasło dev — patrz ostrzeżenie na górze pliku. `start-dev` poniżej też jawnie oznacza to jako
      # tryb deweloperski Keycloaka (bez HTTPS, bez hardeningu produkcyjnego).
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/turniejo
      KC_DB_USERNAME: turniejo
      KC_DB_PASSWORD: turniejo
      # Wstawiane w "secret" klienta turniejo-backend-admin przy imporcie realmu (placeholder w JSON).
      # Musi się zgadzać z Keycloak:AdminClientSecret w appsettings.Development.json.
      TURNIEJO_BACKEND_ADMIN_SECRET: dev-backend-admin-secret
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: turniejo-pgadmin
    environment:
      # Hasło dev — patrz ostrzeżenie na górze pliku.
      PGADMIN_DEFAULT_EMAIL: admin@turniejo.pl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Statystyki odwiedzin bez ciasteczek (frontend: NEXT_PUBLIC_UMAMI_*). Opcjonalne — startuje tylko z
  # `docker compose --profile analytics up -d`. Panel: http://localhost:3001, domyślnie admin/umami.
  umami-db:
    image: postgres:16
    container_name: turniejo-umami-db
    profiles: ["analytics"]
    environment:
      # Hasło dev — patrz ostrzeżenie na górze pliku.
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
      POSTGRES_DB: umami
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: turniejo-umami
    profiles: ["analytics"]
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      # Sekret dev — patrz ostrzeżenie na górze pliku.
      APP_SECRET: turniejo-umami-dev-secret
    ports:
      - "3001:3000"
    depends_on:
      umami-db:
        condition: service_healthy

volumes:
  postgres_data:
  umami_data:
